
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Clear npm cache
        run: npm cache clean --force
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          CI: false
      
      - name: Aggressively optimize build output
        run: |
          echo "Starting aggressive optimization of build output..."
          cd dist
          
          # Count files before optimization
          echo "Files before optimization:"
          find . -type f | wc -l
          
          # Remove all source maps
          find . -name "*.map" -type f -delete
          
          # Remove TypeScript definition files
          find . -name "*.d.ts" -type f -delete
          
          # Remove build info files
          find . -name "*.tsbuildinfo" -type f -delete
          
          # Remove any test files that might have been included
          find . -name "*.test.*" -type f -delete
          find . -name "*.spec.*" -type f -delete
          
          # Remove any duplicate or unnecessary asset files
          find . -name "*.txt" -type f ! -name "robots.txt" -delete
          
          # Consolidate and minify remaining files
          # Remove any empty directories
          find . -type d -empty -delete
          
          # Count files after optimization
          echo "Files after optimization:"
          find . -type f | wc -l
          
          # Show directory structure
          echo "Final directory structure:"
          ls -la
          
          # Ensure we have essential files
          echo "Checking for essential files:"
          ls -la index.html || echo "Warning: No index.html found"
          ls -la assets/ || echo "Warning: No assets directory found"
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BEACH_0E0776403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: ""
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BEACH_0E0776403 }}
          action: "close"
