
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Clear npm cache
        run: npm cache clean --force
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          CI: false
      
      - name: Extreme file optimization for Azure deployment
        run: |
          echo "Starting extreme file optimization..."
          cd dist
          
          # Count files before optimization
          echo "Files before optimization:"
          find . -type f | wc -l
          
          # Remove ALL source maps
          find . -name "*.map" -type f -delete
          
          # Remove TypeScript definition files
          find . -name "*.d.ts" -type f -delete
          
          # Remove build info files
          find . -name "*.tsbuildinfo" -type f -delete
          
          # Remove test files
          find . -name "*.test.*" -type f -delete
          find . -name "*.spec.*" -type f -delete
          
          # Remove documentation files
          find . -name "*.md" -type f -delete
          find . -name "README*" -type f -delete
          find . -name "CHANGELOG*" -type f -delete
          find . -name "LICENSE*" -type f -delete
          
          # Remove configuration files that aren't needed in production
          find . -name ".eslintrc*" -type f -delete
          find . -name "tsconfig*" -type f -delete
          find . -name "vite.config*" -type f -delete
          find . -name "tailwind.config*" -type f -delete
          find . -name "postcss.config*" -type f -delete
          
          # Remove any text files except robots.txt
          find . -name "*.txt" -type f ! -name "robots.txt" -delete
          
          # Remove any duplicate or unnecessary files
          find . -name "*.json" -type f ! -name "package.json" ! -name "manifest.json" -delete
          
          # Remove any backup or temporary files
          find . -name "*~" -type f -delete
          find . -name "*.bak" -type f -delete
          find . -name "*.tmp" -type f -delete
          find . -name "*.temp" -type f -delete
          
          # Remove git-related files
          find . -name ".git*" -type f -delete
          
          # Remove node_modules if it somehow got copied
          rm -rf node_modules 2>/dev/null || true
          
          # Remove any .cache directories
          find . -name ".cache" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # Remove empty directories
          find . -type d -empty -delete 2>/dev/null || true
          
          # Consolidate CSS files if possible (merge small CSS files)
          if [ $(find . -name "*.css" -type f | wc -l) -gt 5 ]; then
            echo "Consolidating CSS files..."
            find . -name "*.css" -type f -size -1k -exec cat {} \; > combined-small.css
            find . -name "*.css" -type f -size -1k -delete
          fi
          
          # Count files after optimization
          echo "Files after extreme optimization:"
          find . -type f | wc -l
          
          # Show final structure
          echo "Final directory structure:"
          find . -type f | head -20
          echo "..."
          
          # Verify essential files exist
          echo "Checking essential files:"
          ls -la index.html 2>/dev/null || echo "ERROR: index.html missing!"
          ls -la assets/ 2>/dev/null || echo "WARNING: No assets directory"
          
          # Final file count check
          FILE_COUNT=$(find . -type f | wc -l)
          echo "Total files remaining: $FILE_COUNT"
          if [ $FILE_COUNT -gt 1000 ]; then
            echo "WARNING: File count still high ($FILE_COUNT), but proceeding..."
          else
            echo "SUCCESS: File count optimized to $FILE_COUNT files"
          fi
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BEACH_0E0776403 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" 
          api_location: ""
          output_location: "dist"
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BEACH_0E0776403 }}
          action: "close"
